name: Rollback

# One step: Actions tab -> Rollback -> "Run workflow".
# Leave the image blank to go back to the previously deployed image, or paste
# a specific image reference to pin any earlier build.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to roll back to (blank = previously deployed image)'
        required: false
        default: ''

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ inputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # tr strips Windows line endings in case the key was pasted from a CRLF file.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOC
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOC

      - name: Roll back and health-check
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null \
            && /opt/tidewater/bin/rollback.sh '$TARGET'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"

      - name: Rollback summary
        run: |
          echo "### Rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${TARGET:-previously deployed image}" >> "$GITHUB_STEP_SUMMARY"
