name: Rollback

# One step: Actions tab -> Rollback -> "Run workflow".
# Leave the image blank to go back to the previously deployed image, or paste
# a specific image reference to pin any earlier build.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to roll back to (blank = previously deployed image)'
        required: false
        default: ''

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ inputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Stop with a plain-English error if a secret is missing, not a cryptic ssh one.
          missing=""
          [ -n "$VPS_HOST" ]    || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ]    || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          # tr strips Windows line endings in case the key was pasted from a CRLF file.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 </dev/null; then
            echo "::error title=Bad SSH key::VPS_SSH_KEY must be the whole private key file, BEGIN and END lines included, with no passphrase."
            exit 1
          fi

          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error title=VPS unreachable::No SSH answer from VPS_HOST on port $VPS_PORT. Check the IP, the port and the VPS firewall."
            exit 1
          fi

          cat >> ~/.ssh/config <<EOC
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
          EOC

      - name: Check the VPS is ready
        run: |
          if ! ssh vps true; then
            echo "::error title=SSH login refused::The VPS rejected the key for VPS_USER. Put the matching public key in that user's ~/.ssh/authorized_keys (deploy/vps-setup.sh does this)."
            exit 1
          fi
          if ! ssh vps 'test -x /opt/tidewater/bin/rollback.sh'; then
            echo "::error title=Nothing deployed yet::/opt/tidewater/bin/rollback.sh is missing. Run the CI/CD workflow successfully at least twice before rolling back."
            exit 1
          fi
          echo "VPS ready for rollback"

      - name: Roll back and health-check
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # $TARGET and $GHCR_USER are expanded here on purpose; \$? and \$rc run on the VPS.
          # shellcheck disable=SC2029
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null \
            && /opt/tidewater/bin/rollback.sh '$TARGET'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"

      - name: Rollback summary
        run: |
          echo "### Rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${TARGET:-previously deployed image}" >> "$GITHUB_STEP_SUMMARY"
