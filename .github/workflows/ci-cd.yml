name: CI/CD

# Pull requests get the test job only. Pushes to main run the whole chain:
#   test  ->  build & push image  ->  deploy to the VPS + health check
# Every later job declares `needs:` on the one before it, so a red test job
# means nothing is built, pushed or deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image tags
        id: meta
        run: |
          # GHCR requires lowercase names; github.repository may contain capitals.
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.meta.outputs.image }}`' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # tr strips Windows line endings in case the key was pasted from a CRLF file.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOC
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOC

      - name: Copy deploy scripts to the VPS
        run: |
          ssh vps 'mkdir -p /opt/tidewater/bin /opt/tidewater/state'
          scp deploy/common.sh deploy/deploy.sh deploy/rollback.sh vps:/opt/tidewater/bin/
          ssh vps 'chmod +x /opt/tidewater/bin/*.sh'

      - name: Deploy and health-check
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # The token travels over stdin, never on a command line. docker login caches it in
          # ~/.docker/config.json on the VPS, so log out again whatever the script returns.
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null \
            && /opt/tidewater/bin/deploy.sh '$IMAGE'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"

      - name: Deployment summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$IMAGE"'` is live and passed /health' >> "$GITHUB_STEP_SUMMARY"
